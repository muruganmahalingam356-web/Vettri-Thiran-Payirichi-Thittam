{% extends "base.html" %}{% block title %}Home Planner{% endblock %}
{% block content %}<section class="form-page"><div class="page-head"><p class="eyebrow">HOME INTERIOR PLANNER</p><h1>Build a home plan</h1><p>Enter a total budget and the rooms you want to plan.</p></div><form class="planner-form" method="post" action="/generate-home"><label>Total budget (₹)<input type="number" name="budget" min="1" step="1" required placeholder="100000"></label><label>Rooms <small>Comma-separated</small><input name="rooms" required placeholder="Living Room, Bedroom, Kitchen"></label><label>Style<select name="style"><option>Modern</option><option>Minimal</option><option>Traditional</option><option>Contemporary</option><option>Industrial</option></select></label><label>Extra notes<textarea name="notes" rows="4" placeholder="Example: Need more storage and warm lighting."></textarea></label><button class="btn" type="submit">Generate Recommendations</button></form></section>{% endblock %}
