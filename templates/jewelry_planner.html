{% extends "base.html" %}{% block title %}Jewelry Planner{% endblock %}
{% block content %}<section class="form-page"><div class="page-head"><p class="eyebrow">JEWELRY BUDGET PLANNER</p><h1>Find a matching jewelry plan</h1><p>Use occasion and style preferences. You can optionally upload an outfit image.</p></div><form class="planner-form" method="post" action="/generate-jewelry" enctype="multipart/form-data"><label>Budget (₹)<input type="number" name="budget" min="1" step="1" required placeholder="15000"></label><label>Occasion<select name="occasion"><option>Wedding</option><option>Birthday</option><option>Party</option><option>Engagement</option><option>Festival</option><option>Daily Wear</option></select></label><label>Style<select name="style"><option>Elegant</option><option>Minimal</option><option>Traditional</option><option>Modern</option><option>Statement</option></select></label><label>Outfit image <small>Optional · JPG/PNG/WEBP · max 5 MB</small><input type="file" name="outfit_image" accept="image/jpeg,image/png,image/webp"></label><label>Extra notes<textarea name="notes" rows="4" placeholder="Example: Prefer gold-tone pieces."></textarea></label><button class="btn" type="submit">Generate Jewelry Plan</button></form></section>{% endblock %}
