{% extends "base.html" %}{% block title %}Register · PocketSmart AI{% endblock %}
{% block content %}<section class="auth-card"><h1>Create your account</h1><p>Save and revisit your recommendation plans.</p>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post" action="/register"><label>Name<input name="name" minlength="2" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required></label><button class="btn" type="submit">Register</button></form><p class="muted">Already registered? <a href="/login">Login</a></p></section>{% endblock %}
