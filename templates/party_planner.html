{% extends "base.html" %}{% block title %}Party Planner{% endblock %}
{% block content %}<section class="form-page"><div class="page-head"><p class="eyebrow">PARTY BUDGET PLANNER</p><h1>Plan your event</h1><p>Give us the budget, guest count and event context.</p></div><form class="planner-form" method="post" action="/generate-party"><label>Total budget (₹)<input type="number" name="budget" min="1" step="1" required placeholder="50000"></label><label>Guests<input type="number" name="guests" min="1" required placeholder="50"></label><label>Event type<select name="event_type"><option>Birthday</option><option>Wedding</option><option>Corporate</option><option>Engagement</option><option>Other</option></select></label><label>Venue<select name="venue"><option>Home</option><option>Banquet Hall</option><option>Restaurant</option><option>Outdoor</option><option>Hotel</option></select></label><label>Extra notes<textarea name="notes" rows="4" placeholder="Food preferences, theme, location, etc."></textarea></label><button class="btn" type="submit">Generate Party Plan</button></form></section>{% endblock %}
